- job:
    name: ceph-website-prs
    description: |
      Builds PRs from github.com/ceph/ceph.io and serves them at
      $prnumber.ceph.io.  Fired by a ceph/ceph.io webhook delivering
      pull_request and issue_comment events to the generic webhook trigger
      (token in the ceph-io-pr-trigger-token credential) when a PR is
      opened, reopened or pushed, or when someone comments "jenkins test" or
      "jenkins retest" on it.  Can also be run manually by setting
      ghprbPullId.
    node: www
    project-type: freestyle
    defaults: global
    quiet-period: 5
    block-downstream: false
    block-upstream: false
    properties:
      - build-discarder:
          days-to-keep: -1
          num-to-keep: 20
          artifact-days-to-keep: -1
          artifact-num-to-keep: -1
      - github:
          url: https://github.com/ceph/ceph.io
      - inject:
          properties-content: |
            PR_REPO=ceph/ceph.io
            PR_STATUS_CONTEXT=Compiling site

    parameters:
      - string:
          name: ghprbPullId
          description: "the GitHub pull id, like '72' in 'ceph.io/pull/72'"
      - string:
          name: pr_number
          default: ''
          description: "set by the webhook for pull_request events; leave empty"
      - string:
          name: STATUS_PREFIX
          default: ''
          description: "Prefix for the GitHub status context (e.g. 'test/' while testing, so the real context isn't touched)"

    # Authorization (author or commenter permission / ci-approved label) and
    # the commit status are handled by scripts/github_pr_webhook.sh.
    triggers:
      - generic-webhook-trigger:
          token-credential-id: ceph-io-pr-trigger-token
          print-contrib-var: true
          post-content-params:
            - type: JSONPath
              key: repo
              value: $.repository.full_name
            - type: JSONPath
              key: action
              value: $.action
            - type: JSONPath
              key: sender
              value: $.sender.login
            - type: JSONPath
              key: pr_number
              value: $.pull_request.number
            - type: JSONPath
              key: pr_author
              value: $.pull_request.user.login
            - type: JSONPath
              key: ghprbPullId
              value: $.issue.number
            - type: JSONPath
              key: issue_is_pr
              value: $.issue.pull_request.url
            - type: JSONPath
              key: comment_body
              value: $.comment.body
            - type: JSONPath
              key: comment_author
              value: $.comment.user.login
          regex-filter-text: $repo:$action:$issue_is_pr:$comment_body
          regex-filter-expression: "(?is)^ceph/ceph\\.io:((opened|reopened|synchronize):.*|created:https.*jenkins\\s+(re)?test\\b.*)$"
          cause: "GitHub $action by $sender for PR $ghprbPullId$pr_number"

    scm:
      - git:
          url: https://github.com/ceph/ceph.io
          branches:
            - origin/pr/${{ghprbPullId}}${{pr_number}}/merge
          refspec: +refs/pull/${{ghprbPullId}}${{pr_number}}/*:refs/remotes/origin/pr/${{ghprbPullId}}${{pr_number}}/*
          browser: auto
          skip-tag: true
          timeout: 20
          wipe-workspace: true

    builders:
      - shell:
          !include-raw-verbatim:
            - ../../../scripts/build_utils.sh
            - ../../../scripts/github_pr_webhook.sh
            - ../../../scripts/ceph-website/install-deps.sh
            - ../../build/build

    wrappers:
      - credentials-binding:
          - username-password-separated:
              credential-id: github-app-ceph-jenkins
              username: GITHUB_USER
              password: GITHUB_PASS
          - username-password-separated:
              credential-id: github-app-ceph-jenkins
              username: GITHUB_STATUS_USER
              password: GITHUB_STATUS_TOKEN
