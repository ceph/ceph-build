- job:
    name: jenkins-job-builder
    node: small
    project-type: freestyle
    defaults: global
    display-name: 'Jenkins Job Builder'
    # Two overlapping runs would double the config-update load on the
    # controller and race on the persisted JJB cache artifact; queue instead.
    concurrent: false
    quiet-period: 5
    block-downstream: false
    block-upstream: false
    retry-count: 3
    properties:
      - github:
          url: https://github.com/ceph/ceph-build

    parameters:
      - bool:
          name: FORCE
          default: false
          description: "
If this is unchecked, then JJB will use its cache to update jobs. This makes this JJB job run faster, but it could cause JJB to fail to update some Jenkins jobs if the jobs have been changed outside of this JJB job's workflow. (This is the default.)

If this is checked, JJB will wipe out its cache and force each job to align with the configurations in main."

    triggers:
      - github

    wrappers:
      - inject-passwords:
          global: true
          mask-password-params: true
      - credentials-binding:
          - username-password-separated:
              credential-id: jenkins-api-token
              username: JOB_BUILDER_USER
              password: JOB_BUILDER_PASS

    scm:
      - git:
          url: https://github.com/ceph/ceph-build
          branches:
            - main
          browser: auto
          timeout: 20

    builders:
      - shell:
          !include-raw-verbatim:
            - ../../../scripts/build_utils.sh
            - ../../build/build

    publishers:
      # Persist JJB's md5 cache between runs; builders are ephemeral, and
      # without this every run starts cold and reconfigures every job on the
      # controller at once (which has made Jenkins unresponsive).
      - archive:
          artifacts: 'jenkins_jobs_cache.tar.gz'
          allow-empty: true
      - postbuildscript:
          builders:
            - role: SLAVE
              build-on:
                  - SUCCESS
                  - NOT_BUILT
                  - UNSTABLE
                  - FAILURE
                  - ABORTED
              build-steps:
                - shell: 'rm $HOME/.jenkins_jobs.*.ini'
