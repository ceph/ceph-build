- scm:
    name: ceph
    scm:
      - git:
          url: https://github.com/ceph/ceph.git
          branches:
            - ${{sha1}}
          refspec: +refs/pull/${{ghprbPullId}}/*:refs/remotes/origin/pr/${{ghprbPullId}}/*
          browser: auto
          timeout: 20
          skip-tag: true
          wipe-workspace: true
          basedir: "ceph"

- scm:
    name: ceph-build
    scm:
      - git:
          url: https://github.com/ceph/ceph-build.git
          branches:
            - origin/main
          browser-url: https://github.com/ceph/ceph-build
          timeout: 20
          skip-tag: true
          wipe-workspace: false
          basedir: "ceph-build"


- job:
    name: ceph-pr-commits
    node: small
    project-type: freestyle
    defaults: global
    display-name: 'ceph: Pull Request commits'
    concurrent: true
    quiet-period: 5
    block-downstream: false
    block-upstream: false
    retry-count: 3
    properties:
      - build-discarder:
          days-to-keep: 15
          artifact-days-to-keep: 15
      - github:
          url: https://github.com/ceph/ceph/

    parameters:
      - string:
          name: sha1
          description: "commit id or a refname, like 'origin/pr/72/head'"

    triggers:
      - github-pull-request:
          allow-whitelist-orgs-as-admins: true
          org-list:
            - ceph
          trigger-phrase: 'jenkins test signed'
          only-trigger-phrase: false
          github-hooks: true
          permit-all: false
          auto-close-on-fail: false
          status-context: "Signed-off-by"
          started-status: "checking if commits are signed"
          success-status: "all commits in this PR are signed"
          failure-status: "one or more commits in this PR are not signed"

      - generic-webhook-trigger:
          token-credential-id: ci-approved-trigger-token
          print-contrib-var: true
          post-content-params:
            - type: JSONPath
              key: action
              value: $.action
            - type: JSONPath
              key: label
              value: $.label.name
            - type: JSONPath
              key: ghprbPullId
              value: $.pull_request.number
            - type: JSONPath
              key: ghprbTargetBranch
              value: $.pull_request.base.ref
            - type: JSONPath
              key: ghprbSourceBranch
              value: $.pull_request.head.ref
            - type: JSONPath
              key: ghprbActualCommit
              value: $.pull_request.head.sha
            - type: JSONPath
              key: sha1
              value: $.pull_request.head.sha
          regex-filter-text: '$action $label $ghprbPullId'
          regex-filter-expression: '^labeled ci-approved \d+$'
          cause: 'PR #$ghprbPullId labeled ci-approved'

    scm:
      - ceph
      - ceph-build


    builders:
      - shell:
          !include-raw-verbatim:
            - ../../../scripts/build_utils.sh
            - ../../build/build

    publishers:
      - junit:
          results: report.xml
          allow-empty-results: true
