# macros

- scm:
    name: ceph-main
    scm:
      - git:
          url: https://github.com/ceph/ceph.git
          browser: githubweb
          browser-url: https://github.com/ceph/ceph/
          branches:
            - origin/main
          skip-tag: true
          timeout: 20
          basedir: "ceph-main"
          shallow-clone: true
          wipe-workspace: true

- scm:
    name: ceph-pr
    scm:
      - git:
          url: https://github.com/ceph/ceph.git
          browser: githubweb
          browser-url: https://github.com/ceph/ceph/
          branches:
            - origin/pr/${{ghprbPullId}}/merge
          refspec: +refs/pull/${{ghprbPullId}}/*:refs/remotes/origin/pr/${{ghprbPullId}}/*
          timeout: 20
          basedir: "ceph-pr"
          shallow-clone: true
          wipe-workspace: true

- scm:
    name: cbt
    scm:
      - git:
          url: https://github.com/ceph/cbt.git
          browser: githubweb
          browser-url: https://github.com/ceph/cbt/
          refspec: +refs/heads/main:refs/remotes/origin/main
          do-not-fetch-tags: true
          honor-refspec: true
          name: origin
          branches:
            - refs/heads/main
          timeout: 20
          wipe-workspace: false
          basedir: "cbt"
          skip-tag: true
          shallow-clone: true
          clean:
            after: true

- job-template:
    name: 'ceph-perf-{osd-flavor}'
    project-type: freestyle
    defaults: global
    # Serialize within this job; throttle category also serializes classic vs crimson.
    concurrent: false
    node: performance
    display-name: 'ceph: {osd-flavor} perf test'
    description: 'CBT performance regression check ({osd-flavor} flavor): builds ceph-pr and ceph-main, runs flavor-specific radosbench workloads, and compares results via cbt/compare.py. Classic uses qa/suites/perf-basic write; crimson always uses SeaStore (spare NVMes when available, else workspace sparse images). Trigger with comment: jenkins test {osd-flavor} perf'
    quiet-period: 5
    block-downstream: false
    block-upstream: false
    retry-count: 3
    disabled: false
    check-app-id: "62865"
    check-install-id: "8465036"
    check-name: "perf-test-{osd-flavor}"
    check-repo-owner: "ceph"
    check-repo-name: "ceph"

    properties:
      - build-discarder:
          days-to-keep: 60
          num-to-keep: 300
          artifact-days-to-keep: 60
          artifact-num-to-keep: 300
      - github:
          url: https://github.com/ceph/ceph/
      - rebuild:
          auto-rebuild: true
      - throttle:
          option: category
          max-total: 1
          max-per-node: 1
          categories:
            - ceph-perf

    parameters:
      - string:
          name: ghprbPullId
          description: "the GitHub pull id, like '72' in 'ceph/pull/72'"
      - string:
          name: CEPH_PERF_EXTRA_CMAKE_ARGS
          default: ''
          description: 'Extra CMake arguments appended to the build (use this to disable additional components for a more minimal build).'

    # Same shared ceph/ceph webhook as ceph-pr-pipeline-trigger (matched by
    # the pr-check-trigger-token credential); the filter only fires this job
    # for new PR comments containing the trigger phrase.  Authorization
    # (commenter permission / ci-approved label) is checked in common.sh at
    # the top of every build step.  ghprbPullId comes from the payload's
    # issue number, which the ceph-pr SCM picks up.
    triggers:
      - generic-webhook-trigger:
          token: ceph-perf-{osd-flavor}
          token-credential-id: pr-check-trigger-token
          print-contrib-var: true
          post-content-params:
            - type: JSONPath
              key: action
              value: $.action
            - type: JSONPath
              key: ghprbPullId
              value: $.issue.number
            - type: JSONPath
              key: issue_is_pr
              value: $.issue.pull_request.url
            - type: JSONPath
              key: comment_body
              value: $.comment.body
            - type: JSONPath
              key: comment_author
              value: $.comment.user.login
          regex-filter-text: $action:$issue_is_pr:$comment_body
          # A created issue_comment on a PR (issue_is_pr non-empty) containing
          # the trigger phrase.
          regex-filter-expression: "(?is)^created:https[^:]*:.*jenkins\\s+test\\s+{osd-flavor}\\s+perf\\b.*$"
          cause: "GitHub comment by $comment_author on PR $ghprbPullId"

    scm:
      - ceph-main
      - ceph-pr
      - cbt

    builders:
      - inject:
          properties-content: |
            OSD_FLAVOR={osd-flavor}
            CHECK_APP_ID={check-app-id}
            CHECK_INSTALL_ID={check-install-id}
            CHECK_NAME={check-name}
            CHECK_REPO_OWNER={check-repo-owner}
            CHECK_REPO_NAME={check-repo-name}
      - shell:
          !include-raw-verbatim:
            - ../../build/common.sh
            - ../../build/setup-pre.sh
            - ../../build/prepare-workloads-header.sh
            - ../../build/prepare-workloads.py
            - ../../build/prepare-workloads-footer.sh
            - ../../build/setup-post.sh

      # ideally cbt-results should be persisted across jobs so main baselines can be reused
      - inject:
          properties-content: |
            SRC_DIR=ceph-main
            WORKLOAD=read
            ARCHIVE_KIND=cbt-results
      - shell:
          !include-raw-verbatim:
            - ../../build/common.sh
            - ../../build/run-cbt
      - inject:
          properties-content: |
            SRC_DIR=ceph-main
            WORKLOAD=write
            ARCHIVE_KIND=cbt-results
      - shell:
          !include-raw-verbatim:
            - ../../build/common.sh
            - ../../build/run-cbt
      - inject:
          properties-content: |
            SRC_DIR=ceph-pr
            WORKLOAD=read
            ARCHIVE_KIND=ceph-pr
      - shell:
          !include-raw-verbatim:
            - ../../build/common.sh
            - ../../build/run-cbt
      - inject:
          properties-content: |
            SRC_DIR=ceph-pr
            WORKLOAD=write
            ARCHIVE_KIND=ceph-pr
      - shell:
          !include-raw-verbatim:
            - ../../build/common.sh
            - ../../build/run-cbt

      - shell:
          !include-raw-verbatim:
            - ../../build/common.sh
            - ../../build/compare

    publishers:
      - archive:
          artifacts: 'report.md,report-*.md,perf-meta.txt,perf-store-tag,seastore-devs.txt,perf-workloads/**,cbt-results/**/*,ceph-pr/read/**/*,ceph-pr/write/**/*'
          allow-empty: true
          latest-only: false
      - postbuildscript:
          builders:
            - role: SLAVE
              build-on:
                  - SUCCESS
                  - UNSTABLE
                  - FAILURE
                  - ABORTED
              build-steps:
                - shell:
                    !include-raw-verbatim:
                      - ../../build/common.sh
                      - ../../build/cleanup
            - role: SLAVE
              build-on:
                  - FAILURE
                  - ABORTED
              build-steps:
                - shell:
                    !include-raw-verbatim:
                      - ../../build/reboot

    wrappers:
      - timeout:
          # Two Crimson builds (≤2h each) + CBT runs + setup/compare.
          timeout: 480
          timeout-var: 'BUILD_TIMEOUT'
          fail: true
          type: absolute
      - credentials-binding:
          - file:
              credential-id: cephacheck.2020-04-29.private-key.pem
              variable: GITHUB_CHECK_PKEY_PEM
          - username-password-separated:
              credential-id: github-readonly-token
              username: GITHUB_USER
              password: GITHUB_PASS
          - username-password-separated:
              credential-id: github-status-check-token
              username: GITHUB_STATUS_USER
              password: GITHUB_STATUS_TOKEN

- project:
    name: ceph-perf
    osd-flavor:
      - classic
      - crimson
    jobs:
      - 'ceph-perf-{osd-flavor}'
