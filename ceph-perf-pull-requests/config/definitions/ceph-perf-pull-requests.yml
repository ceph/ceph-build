# macros

- scm:
    name: ceph-main
    scm:
      - git:
          url: https://github.com/ceph/ceph.git
          branches:
            - origin/main
          skip-tag: true
          timeout: 20
          basedir: "ceph-main"
          shallow-clone: true
          wipe-workspace: true

- scm:
    name: ceph-pr
    scm:
      - git:
          url: https://github.com/ceph/ceph.git
          branches:
            - origin/pr/${{ghprbPullId}}/merge
          refspec: +refs/pull/${{ghprbPullId}}/*:refs/remotes/origin/pr/${{ghprbPullId}}/*
          timeout: 20
          basedir: "ceph-pr"
          shallow-clone: true
          wipe-workspace: true

- scm:
    name: cbt
    scm:
      - git:
          url: https://github.com/ceph/cbt.git
          refspec: +refs/heads/main:refs/remotes/origin/main
          do-not-fetch-tags: true
          honor-refspec: true
          name: origin
          branches:
            - refs/heads/main
          timeout: 20
          wipe-workspace: false
          basedir: "cbt"
          skip-tag: true
          shallow-clone: true
          clean:
            after: true

- job-template:
    name: 'ceph-perf-{osd-flavor}'
    project-type: freestyle
    defaults: global
    # Serialize within this job; throttle category also serializes classic vs crimson.
    concurrent: false
    node: performance
    display-name: 'ceph: {osd-flavor} perf test'
    description: 'CBT performance regression check ({osd-flavor} flavor): builds ceph-pr and ceph-main, runs flavor-specific radosbench workloads, and compares results via cbt/compare.py. Classic uses qa/suites/perf-basic write; crimson always uses SeaStore (spare NVMes when available, else workspace sparse images). Trigger with comment: jenkins test {osd-flavor} perf'
    quiet-period: 5
    block-downstream: false
    block-upstream: false
    retry-count: 3
    disabled: false
    check-app-id: "62865"
    check-install-id: "8465036"
    check-name: "perf-test-{osd-flavor}"
    check-repo-owner: "ceph"
    check-repo-name: "ceph"

    properties:
      - build-discarder:
          days-to-keep: 60
          num-to-keep: 300
          artifact-days-to-keep: 60
          artifact-num-to-keep: 300
      - github:
          url: https://github.com/ceph/ceph/
      - rebuild:
          auto-rebuild: true
      - throttle:
          option: category
          max-total: 1
          max-per-node: 1
          categories:
            - ceph-perf

    parameters:
      - string:
          name: ghprbPullId
          description: "the GitHub pull id, like '72' in 'ceph/pull/72'"
      - string:
          name: CEPH_PERF_EXTRA_CMAKE_ARGS
          default: ''
          description: 'Extra CMake arguments appended to the build (use this to disable additional components for a more minimal build).'

    triggers:
      - github-pull-request:
          allow-whitelist-orgs-as-admins: true
          org-list:
            - ceph
          trigger-phrase: '(?i)jenkins\s+test\s+{osd-flavor}\s+perf\b'
          skip-build-phrase: '(?i)^jenkins do not test.*'
          only-trigger-phrase: true
          github-hooks: true
          permit-all: false
          auto-close-on-fail: false
          cancel-builds-on-update: true
          status-context: 'ceph {osd-flavor} perf regression'
          started-status: 'running ceph {osd-flavor} perf regression'
          success-status: 'ceph {osd-flavor} perf regression passed'
          failure-status: 'ceph {osd-flavor} perf regression failed'

    scm:
      - ceph-main
      - ceph-pr
      - cbt

    builders:
      - inject:
          properties-content: |
            OSD_FLAVOR={osd-flavor}
            CHECK_APP_ID={check-app-id}
            CHECK_INSTALL_ID={check-install-id}
            CHECK_NAME={check-name}
            CHECK_REPO_OWNER={check-repo-owner}
            CHECK_REPO_NAME={check-repo-name}
      - shell:
          !include-raw-verbatim:
            - ../../build/common.sh
            - ../../build/setup-pre.sh
            - ../../build/prepare-workloads-header.sh
            - ../../build/prepare-workloads.py
            - ../../build/prepare-workloads-footer.sh
            - ../../build/setup-post.sh

      # ideally cbt-results should be persisted across jobs so main baselines can be reused
      - inject:
          properties-content: |
            SRC_DIR=ceph-main
            WORKLOAD=read
            ARCHIVE_KIND=cbt-results
      - shell:
          !include-raw-verbatim:
            - ../../build/common.sh
            - ../../build/run-cbt
      - inject:
          properties-content: |
            SRC_DIR=ceph-main
            WORKLOAD=write
            ARCHIVE_KIND=cbt-results
      - shell:
          !include-raw-verbatim:
            - ../../build/common.sh
            - ../../build/run-cbt
      - inject:
          properties-content: |
            SRC_DIR=ceph-pr
            WORKLOAD=read
            ARCHIVE_KIND=ceph-pr
      - shell:
          !include-raw-verbatim:
            - ../../build/common.sh
            - ../../build/run-cbt
      - inject:
          properties-content: |
            SRC_DIR=ceph-pr
            WORKLOAD=write
            ARCHIVE_KIND=ceph-pr
      - shell:
          !include-raw-verbatim:
            - ../../build/common.sh
            - ../../build/run-cbt

      - shell:
          !include-raw-verbatim:
            - ../../build/common.sh
            - ../../build/compare

    publishers:
      - archive:
          artifacts: 'report.md,report-*.md,perf-meta.txt,perf-store-tag,seastore-devs.txt,perf-workloads/**,cbt-results/**/*,ceph-pr/read/**/*,ceph-pr/write/**/*'
          allow-empty: true
          latest-only: false
      - postbuildscript:
          builders:
            - role: SLAVE
              build-on:
                  - SUCCESS
                  - UNSTABLE
                  - FAILURE
                  - ABORTED
              build-steps:
                - shell:
                    !include-raw-verbatim:
                      - ../../build/common.sh
                      - ../../build/cleanup
            - role: SLAVE
              build-on:
                  - FAILURE
                  - ABORTED
              build-steps:
                - shell:
                    !include-raw-verbatim:
                      - ../../build/reboot

    wrappers:
      - timeout:
          # Two Crimson builds (≤2h each) + CBT runs + setup/compare.
          timeout: 480
          timeout-var: 'BUILD_TIMEOUT'
          fail: true
          type: absolute
      - credentials-binding:
          - file:
              credential-id: cephacheck.2020-04-29.private-key.pem
              variable: GITHUB_CHECK_PKEY_PEM

- project:
    name: ceph-perf
    osd-flavor:
      - classic
      - crimson
    jobs:
      - 'ceph-perf-{osd-flavor}'
