- job:
    name: ceph-dashboard-cephadm-e2e
    project-type: freestyle
    defaults: global
    concurrent: true
    node: huge && noble && x86_64
    display-name: 'ceph: Dashboard + Cephadm E2E'
    description: |
      Dashboard + cephadm e2e tests for a ceph.git PR.  Fired by the generic
      webhook trigger (the ceph/ceph webhook that feeds
      ceph-pr-pipeline-trigger) when a PR labelled "cephadm" or "dashboard"
      is opened, reopened or pushed, when either label is added, or when
      someone comments "jenkins test dashboard cephadm" on a PR.  Can also be run manually by setting
      ghprbPullId.
    quiet-period: 5
    block-downstream: false
    block-upstream: false
    retry-count: 3
    properties:
      - build-discarder:
          days-to-keep: 15
          num-to-keep: 300
          artifact-days-to-keep: -1
          artifact-num-to-keep: -1
      - github:
          url: https://github.com/ceph/ceph/
      - rebuild:
          auto-rebuild: true
      - inject:
          properties-content: |
            TERM=xterm
            PR_STATUS_CONTEXT=ceph dashboard cephadm e2e tests

    parameters:
      - string:
          name: ghprbPullId
          description: "the GitHub pull id, like '72' in 'ceph/pull/72'"
      - string:
          name: pr_number
          default: ''
          description: "set by the webhook for pull_request events; leave empty"
      - string:
          name: STATUS_PREFIX
          default: ''
          description: "Prefix for the GitHub status context (e.g. 'test/' while testing, so the real context isn't touched)"

    # See ceph-dashboard-pull-requests for how the trigger works.
    triggers:
      - generic-webhook-trigger:
          token-credential-id: pr-check-trigger-token
          print-contrib-var: true
          post-content-params:
            - type: JSONPath
              key: repo
              value: $.repository.full_name
            - type: JSONPath
              key: action
              value: $.action
            - type: JSONPath
              key: sender
              value: $.sender.login
            - type: JSONPath
              key: pr_number
              value: $.pull_request.number
            - type: JSONPath
              key: pr_author
              value: $.pull_request.user.login
            - type: JSONPath
              key: pr_labels
              value: $.pull_request.labels[*].name
            - type: JSONPath
              key: label_name
              value: $.label.name
            - type: JSONPath
              key: ghprbPullId
              value: $.issue.number
            - type: JSONPath
              key: issue_is_pr
              value: $.issue.pull_request.url
            - type: JSONPath
              key: comment_body
              value: $.comment.body
            - type: JSONPath
              key: comment_author
              value: $.comment.user.login
          regex-filter-text: $repo:$action:$label_name:$issue_is_pr:$pr_labels:$comment_body
          regex-filter-expression: "(?is)^ceph/ceph:((opened|reopened|synchronize):::[^:]*(?<![\\w-])(cephadm|dashboard)(?![\\w-])[^:]*:.*|labeled:(cephadm|dashboard)::.*|created::https.*jenkins\\s+test\\s+dashboard\\s+cephadm\\b.*)$"
          cause: "GitHub $action by $sender for PR $ghprbPullId$pr_number"

    scm:
      - git:
          url: https://github.com/ceph/ceph.git
          browser: githubweb
          browser-url: https://github.com/ceph/ceph/
          branches:
            - origin/pr/${{ghprbPullId}}${{pr_number}}/merge
          refspec: +refs/pull/${{ghprbPullId}}${{pr_number}}/*:refs/remotes/origin/pr/${{ghprbPullId}}${{pr_number}}/*
          changelog-against:
            remote: origin
            branch: main
          timeout: 20
          skip-tag: true
          shallow-clone: true
          depth: 50
          wipe-workspace: true

      - git:
          url: https://github.com/ceph/ceph-build.git
          browser: githubweb
          browser-url: https://github.com/ceph/ceph-build/
          branches:
            - main
          basedir: ceph-build

    builders:
      - shell:
          !include-raw-verbatim:
            - ../../../scripts/build_utils.sh
            - ../../../scripts/github_pr_webhook.sh
            - ../../../scripts/setup_container_runtime.sh
            - ../../../scripts/dashboard/install-e2e-test-deps.sh
            - ../../../scripts/dashboard/install-cephadm-e2e-deps.sh
            - ../../build/build

    wrappers:
      - inject-passwords:
          global: true
          mask-password-params: true
      - credentials-binding:
          - username-password-separated:
              credential-id: github-app-ceph-jenkins
              username: GITHUB_USER
              password: GITHUB_PASS
          - username-password-separated:
              credential-id: github-app-ceph-jenkins
              username: GITHUB_STATUS_USER
              password: GITHUB_STATUS_TOKEN
          - text:
              credential-id: cd-cypress-record-key
              variable: CYPRESS_RECORD_KEY
      - ansicolor

    publishers:
      - archive:
          artifacts: 'logs/**'
          allow-empty: true
          latest-only: false

      - junit:
          results: 'src/pybind/mgr/dashboard/frontend/cypress/reports/results-*.xml'
          allow-empty: true

      - postbuildscript:
          builders:
            - role: SLAVE
              build-on:
                - SUCCESS
                - UNSTABLE
                - FAILURE
                - ABORTED
              build-steps:
                - shell: "${{WORKSPACE}}/ceph-build/ceph-dashboard-cephadm-e2e/build/cleanup"
