- job:
    name: sepia-fog-images
    project-type: pipeline
    display-name: 'Sepia FOG Image Creator'
    description: "Refreshes FOG testnode images: FOG-deploys the existing image for each distro, updates it in place with cephlab.yml, preps and fscks it, then recaptures it."
    concurrent: false
    quiet-period: 0
    properties:
      - build-discarder:
          days-to-keep: 15
          num-to-keep: 30
          artifact-days-to-keep: -1
          artifact-num-to-keep: -1

    # Run every Sunday at noon
    triggers:
      - timed: "0 12 * * 0"

    parameters:
      - string:
          name: DISTROS
          default: "ubuntu_22.04 ubuntu_24.04 centos_9.stream rocky_10.1"
          description: "Distro to capture images for: (e.g., 'ubuntu_22.04', 'centos_9.stream' or 'ubuntu_22.04 rocky_10.1' for multiple distros)"
      - string:
          name: MACHINETYPES
          default: "trial"
          description: "Machine types to capture images for.  (e.g., 'trial' or 'trial smithi' for multiple machine types)"
      - string:
          name: TEUTHOLOGYBRANCH
          default: main
          description: "Optionally define a different teuthology branch (useful for testing)"
      - string:
          name: CMANSIBLEBRANCH
          default: main
          description: "Optionally define a different ceph-cm-ansible branch (useful for testing)"
      - string:
          name: PAUSEQUEUE
          default: "true"
          description: "Should the teuthology queue be paused?  Recapturing an existing OS image will cause running reimages to fail without pausing the queue.  The queue can remain unpaused when a new distro/version is being captured.  Queue is paused by default."
      - string:
          name: DEFINEDHOSTS
          default: ""
          description: "Define a list of systems to use instead of using teuthology-lock to lock unused systems.  Also used to seed a brand new distro image: image a host by hand, then run this job with DEFINEDHOSTS pointing at it."
      - string:
          name: IMAGETYPE
          default: ""
          description: "Capture the images under a different machine-type name than the nodes being used.  e.g. MACHINETYPES=trial IMAGETYPE=trial-perf locks a trial node, provisions it with the trial_<distro> image, then captures it back as trial-perf_<distro> (creating that image in FOG if needed).  Leave empty to capture back into the same image that was deployed."
      - bool:
          name: SKIPDEPLOY
          default: false
          description: "Skip FOG-deploying the existing image first and capture the hosts' current OS (still updated by cephlab.yml/prep-fog-capture.yml).  Useful with DEFINEDHOSTS when the node is already running exactly what you want, or when the existing image is too old to boot with current ssh keys."
      - choice:
          name: FSCKMETHOD
          choices:
            - fog-postinit
            - maas-rescue
            - none
          description: "How to fsck the root filesystem before capture.  fog-postinit (default) installs a hook on the FOG server that fscks the disk inside the FOG capture environment (no extra reboot).  maas-rescue points the host's dnsmasq entry on soko01 at MAAS, boots into rescue mode, fscks over ssh, then points dnsmasq back at FOG.  none skips fscking."
      - string:
          name: CEPH_BUILD_BRANCH
          default: main
          description: "Use the Jenkinsfile and scripts from this ceph-build branch"

    pipeline-scm:
      scm:
        - git:
            url: https://github.com/ceph/ceph-build.git
            branches:
              - ${{CEPH_BUILD_BRANCH}}
      script-path: sepia-fog-images/build/Jenkinsfile
      lightweight-checkout: true
