# {{ ansible_managed }}
# Rate-limit crawler-bait paths on jenkins.ceph.com.
# See tracker: RunMap lock contention from anonymous pipeline/BlueOcean crawling.

# Internal networks are never rate-limited.
geo $remote_addr $limit_exempt {
    default        0;
    127.0.0.1      1;
    10.0.0.0/8     1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
}

# Cloud ranges with no legit anonymous Jenkins traffic. Deny before rate-limiting.
geo $remote_addr $blocked_net {
    default        0;
    47.64.0.0/10   1;   # Alibaba Cloud
}

# Flag the expensive paths the swarm hammers (pipeline graph, BlueOcean, changes, test history).
map $request_uri $expensive {
    default                 0;
    ~*/execution/node/      1;
    ~^/blue/                1;
    ~*/changes              1;
    ~*testReport/history    1;
    ~*/wfapi/               1;
}

# Per-IP key: set only when expensive AND not internal. Empty key => not limited.
map "$expensive$limit_exempt" $bait_ip_key {
    default   "";
    "10"      $binary_remote_addr;
}

# Global key: one shared bucket for all external bait traffic (protects the RunMap lock
# even when the load is spread across many IPs).
map "$expensive$limit_exempt" $bait_global_key {
    default   "";
    "10"      "bait";
}

# ~2 req/s per IP with a small burst, plus a hard aggregate ceiling of ~5 req/s.
limit_req_zone  $bait_ip_key      zone=jenkins_bait_ip:16m     rate=2r/s;
limit_req_zone  $bait_global_key  zone=jenkins_bait_global:1m  rate=5r/s;
limit_conn_zone $binary_remote_addr zone=jenkins_conn:16m;

limit_req_status  429;
limit_conn_status 429;
