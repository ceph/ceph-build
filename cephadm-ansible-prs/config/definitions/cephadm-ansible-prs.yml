- project:
    name: cephadm-ansible-prs-syntax
    worker_labels: 'libvirt'
    scenario:
      - flake8
      - mypy
      - unittests
    jobs:
      - 'cephadm-ansible-prs-syntax'

- project:
    name: cephadm-ansible-prs-functional
    worker_labels: 'libvirt'
    distribution:
      - el9
      - el10
    scenario:
      - functional
    jobs:
      - 'cephadm-ansible-prs-functional'

# Both templates are fired by a ceph/cephadm-ansible webhook delivering
# pull_request and issue_comment events to
# https://jenkins.ceph.com/generic-webhook-trigger/invoke with the token held
# in the cephadm-ansible-pr-trigger-token credential.  A PR opened, reopened
# or pushed runs every job; a comment runs the job whose phrase it contains
# ("jenkins test all" runs them all).  Authorization (author or commenter
# permission / ci-approved label) and the commit status are handled by
# scripts/github_pr_webhook.sh.  Manual builds set ghprbPullId.
- job-template:
    name: 'cephadm-ansible-prs-{scenario}'
    id: 'cephadm-ansible-prs-syntax'
    node: '{worker_labels}'
    concurrent: true
    defaults: global
    display-name: 'cephadm-ansible: Pull Requests [{scenario}]'
    quiet-period: 5
    block-downstream: false
    block-upstream: false
    retry-count: 3
    properties:
      - github:
          url: https://github.com/ceph/cephadm-ansible
      - build-discarder:
          days-to-keep: 90
          num-to-keep: -1
          artifact-days-to-keep: -1
          artifact-num-to-keep: -1

    parameters:
      - string:
          name: ghprbPullId
          description: "the GitHub pull id, like '72' in 'cephadm-ansible/pull/72'"
      - string:
          name: pr_number
          default: ''
          description: "set by the webhook for pull_request events; leave empty"
      - string:
          name: STATUS_PREFIX
          default: ''
          description: "Prefix for the GitHub status context (e.g. 'test/' while testing, so the real context isn't touched)"

    triggers:
      - generic-webhook-trigger:
          token-credential-id: cephadm-ansible-pr-trigger-token
          print-contrib-var: true
          post-content-params:
            - type: JSONPath
              key: repo
              value: $.repository.full_name
            - type: JSONPath
              key: action
              value: $.action
            - type: JSONPath
              key: sender
              value: $.sender.login
            - type: JSONPath
              key: pr_number
              value: $.pull_request.number
            - type: JSONPath
              key: pr_author
              value: $.pull_request.user.login
            - type: JSONPath
              key: ghprbPullId
              value: $.issue.number
            - type: JSONPath
              key: issue_is_pr
              value: $.issue.pull_request.url
            - type: JSONPath
              key: comment_body
              value: $.comment.body
            - type: JSONPath
              key: comment_author
              value: $.comment.user.login
          regex-filter-text: $repo:$action:$issue_is_pr:$comment_body
          regex-filter-expression: "(?is)^ceph/cephadm-ansible:((opened|reopened|synchronize):.*|created:https.*jenkins\\s+test\\s+({scenario}|all)\\b.*)$"
          cause: "GitHub $action by $sender for PR $ghprbPullId$pr_number"

    scm:
      - git:
          url: https://github.com/ceph/cephadm-ansible.git
          branches:
            - origin/pr/${{ghprbPullId}}${{pr_number}}/merge
          refspec: +refs/pull/${{ghprbPullId}}${{pr_number}}/*:refs/remotes/origin/pr/${{ghprbPullId}}${{pr_number}}/*
          browser: auto
          timeout: 20
          skip-tag: true
          wipe-workspace: false

    builders:
      - inject:
          properties-content: |
            SCENARIO={scenario}
            PR_REPO=ceph/cephadm-ansible
            PR_STATUS_CONTEXT=Testing: {scenario}
      - shell:
          !include-raw-escape:
            - ../../../scripts/build_utils.sh
            - ../../../scripts/github_pr_webhook.sh
            - ../../build/pre
            - ../../build/build

    publishers:
      - postbuildscript:
          builders:
            - role: SLAVE
              build-on:
                  - FAILURE
                  - ABORTED
              build-steps:
                - shell:
                    !include-raw-escape:
                      - ../../../scripts/build_utils.sh
                      - ../../build/teardown

      - archive:
          artifacts: 'logs/**'
          allow-empty: true
          latest-only: false

    wrappers:
      - inject-passwords:
          global: true
          mask-password-params: true
      - credentials-binding:
          - username-password-separated:
              credential-id: github-app-ceph-jenkins
              username: GITHUB_USER
              password: GITHUB_PASS
          - username-password-separated:
              credential-id: github-app-ceph-jenkins
              username: GITHUB_STATUS_USER
              password: GITHUB_STATUS_TOKEN

