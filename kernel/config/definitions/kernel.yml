- job:
    name: kernel
    project-type: pipeline
    display-name: 'kernel'
    concurrent: true
    pipeline-scm:
      scm:
        - git:
            url: https://github.com/ceph/ceph-build
            branches:
              - ${{CEPH_BUILD_BRANCH}}
            shallow-clone: true
            submodule:
              disable: true
            wipe-workspace: true
      script-path: kernel/build/Jenkinsfile
      lightweight-checkout: true
      do-not-fetch-tags: true
    properties:
      - github:
          url: https://github.com/ceph/ceph-client
    parameters:
      - string:
          name: BRANCH
          description: "The git branch (or tag) to build"

      - string:
          name: DISTROS
          description: "A list of distros to build for. Available options are: centos9, rocky10, noble, and jammy"
          default: "centos9 rocky10 jammy noble"

      - string:
          name: ARCHS
          description: "A list of architectures to build for. Available options are: x86_64"
          default: "x86_64"

      - bool:
          name: THROWAWAY
          description: "
Default: False. When True it will not POST binaries to chacra. Artifacts will not be around for long. Useful to test builds."
          default: false

      - bool:
          name: FORCE
          description: "
If this is checked, binaries that already exist in chacra are overwritten."

      - string:
          name: CEPH_BUILD_BRANCH
          description: "Use the Jenkinsfile from this ceph-build branch"
          default: main

    wrappers:
      - inject-passwords:
          global: true
          mask-password-params: true
