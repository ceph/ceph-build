- job:
    name: 'ceph-dev-cron'
    description: 'Twice-daily scheduled build trigger for selected ceph.git branches (only if new commits).'
    node: built-in
    project-type: pipeline
    defaults: global
    concurrent: true
    quiet-period: 0
    block-downstream: false
    block-upstream: false

    properties:
      - build-discarder:
          num-to-keep: 200
          artifact-days-to-keep: -1
          artifact-num-to-keep: -1
      - github:
          url: https://github.com/ceph/ceph
      - copyartifact:
          projects: ceph-dev-cron

    # A full run fans out to ~40 x86 builds, nearly the whole x86 builder
    # pool for 2+ hours.  Keep it off-peak: weekday x86 utilization is
    # 80-91% from 09-18 UTC (PR pipeline traffic) but 22-42% from 22-04 UTC.
    triggers:
      - timed: |
          TZ=Etc/UTC
          H 2 * * *
          H 22 * * *

    pipeline-scm:
      scm:
        - git:
            url: https://github.com/ceph/ceph-build
            branches:
              - main
            shallow-clone: true
            submodule:
              disable: true
            wipe-workspace: true
      script-path: ceph-dev-cron/build/Jenkinsfile
      lightweight-checkout: false
      do-not-fetch-tags: true
