---
- job:
    name: ceph-multibranch-pipeline
    project-type: multibranch
    number-to-keep: 300
    days-to-keep: 30
    scm:
      - github:
          repo: ceph
          repo-owner: ceph
          ssh-checkout:
            credentials: 'jenkins-build'
          credentials-id: github-app-ceph-jenkins
          clean:
            before: true
          shallow-clone: true
          do-not-fetch-tags: true
          discover-pr-forks-trust: contributors
