- job:
    name: ceph-volume-unit-tests
    display-name: 'ceph-volume: Pull Request unit tests'
    description: |
      Runs the ceph-volume tox unit tests for a ceph.git PR.  Triggered by
      commenting "jenkins ceph-volume unit tests" (or "jenkins test
      ceph-volume") on the PR via the generic webhook trigger; the ceph/ceph
      webhook that feeds ceph-pr-pipeline-trigger feeds this job too.  Can
      also be run manually by setting ghprbPullId.
    node: small && centos9
    project-type: freestyle
    defaults: global
    quiet-period: 5
    block-downstream: false
    block-upstream: false
    properties:
      - github:
          url: https://github.com/ceph/ceph
      - build-discarder:
          days-to-keep: 14
    discard-old-builds: true

    parameters:
      - string:
          name: ghprbPullId
          description: "the GitHub pull id, like '72' in 'ceph/pull/72'"

    # Same shared ceph/ceph webhook as ceph-pr-pipeline-trigger (matched by
    # the pr-check-trigger-token credential); the filter only fires this job
    # for new PR comments containing the trigger phrase.  Authorization
    # (commenter permission / ci-approved label) is checked in the build
    # script.  ghprbPullId comes from the payload's issue number, which the
    # SCM branch spec below picks up.
    triggers:
      - generic-webhook-trigger:
          token: ceph-volume-unit-tests
          token-credential-id: pr-check-trigger-token
          print-contrib-var: true
          post-content-params:
            - type: JSONPath
              key: action
              value: $.action
            - type: JSONPath
              key: ghprbPullId
              value: $.issue.number
            - type: JSONPath
              key: issue_is_pr
              value: $.issue.pull_request.url
            - type: JSONPath
              key: comment_body
              value: $.comment.body
            - type: JSONPath
              key: comment_author
              value: $.comment.user.login
          regex-filter-text: $action:$issue_is_pr:$comment_body
          # A created issue_comment on a PR (issue_is_pr non-empty) containing
          # the trigger phrase.
          regex-filter-expression: "(?is)^created:https[^:]*:.*jenkins\\s+(ceph-volume\\s+unit\\s+tests|test\\s+ceph-volume)\\b.*$"
          cause: "GitHub comment by $comment_author on PR $ghprbPullId"

    scm:
      - git:
          url: https://github.com/ceph/ceph
          browser: auto
          branches:
            - origin/pr/${{ghprbPullId}}/merge
          refspec: +refs/pull/${{ghprbPullId}}/*:refs/remotes/origin/pr/${{ghprbPullId}}/*
          skip-tag: true
          shallow-clone: true
          honor-refspec: true
          timeout: 20
          wipe-workspace: true

    builders:
      - shell:
          !include-raw-verbatim:
            - ../../../scripts/build_utils.sh
            - ../../build/build

    wrappers:
      - ansicolor
      - credentials-binding:
          - username-password-separated:
              credential-id: github-readonly-token
              username: GITHUB_USER
              password: GITHUB_PASS
          - username-password-separated:
              credential-id: github-status-check-token
              username: GITHUB_STATUS_USER
              password: GITHUB_STATUS_TOKEN
